<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Login form</title>
          <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
        <link rel="stylesheet" href="style.css">

    </head>
    <body>
        <h1>Login Form</h1>
        <form action="https://httpbin.org/post" method="POST">
            <fieldset class="p-4 shadow rounded">
                <legend>Login Information</legend>
                <label for="username" class="form-label">Username:</label>
                <input type="text" id="username" name="username" required autofocus placeholder="Enter username"
                class="form-control mb-3">
        
                <label for="password" class="form-label">Password:</label>
                <input type="password" id="password" name="password" required placeholder="Enter password" class="form-control mb-3">
    
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </fieldset>
        </form>
        

    </body>

</html>
